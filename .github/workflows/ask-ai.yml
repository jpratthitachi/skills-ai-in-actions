name: Ask AI
on:
  workflow_dispatch:

permissions: {}

jobs:
  ask-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Check Copilot authentication
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "::error::Set the COPILOT_PAT repository secret to a token with Copilot Requests permission."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: AI Inference
        id: ai-response
        uses: actions/ai-inference@v3
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt: |
            Give me a programming joke.

      - name: Display AI Response
        env:
          RESPONSE_FILE: ${{ steps.ai-response.outputs.response-file }}
        run: |
          echo "## 🤖 AI Response" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat "$RESPONSE_FILE" >> "$GITHUB_STEP_SUMMARY"
